name: UTXORef pilot suites

# Every suite, every *.test.js and both locked evals on each push and pull
# request (DOC-1). Zero npm dependencies: nothing is installed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-suites:
    # The suites are developed and run on Windows (DPAPI, junctions, named
    # pipes in the signer tooling); run them where they are maintained.
    runs-on: windows-latest
    # Locally every file runs in about 4 minutes; a suite that hangs is killed
    # after 8 and reported by name (run_test_process.js), so the job ceiling
    # only has to cover the two runners and the evals.
    timeout-minutes: 90
    env:
      UTXOREF_SUITE_TIMEOUT_MS: "480000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...).
      # The DLC stores, signer client and RPC proxy refuse any path whose real
      # path differs from the one given (their guard against links), so tests
      # writing under os.tmpdir() would fail there. Use the long RUNNER_TEMP.
      - name: Long paths and a long-form temp directory
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Referee suites (run_utxoref_all.js, including legacy/)
        run: node bitvm3/utxo_referee/run_utxoref_all.js
      - name: Every *.test.js
        run: node scripts/run_every_test.js
      - name: UTXO referee eval (full, must be perfect)
        run: node eval/utxo_referee_eval.js --profile=full --require-perfect
      - name: DLC security eval (full, must be perfect)
        run: node eval/dlc_security_eval.js --profile=full --require-perfect

  pnl-batch-linux:
    # Durable batch authorization requires POSIX directory fsync. The Windows
    # suites assert that this execution path refuses unsupported durability.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Authenticated batch and journal adversarial tests
        run: >-
          node --test
          bitvm3/utxo_referee/tradelayer_pnl_batch_settlement.test.js
          bitvm3/utxo_referee/tradelayer_pnl_batch_transaction.test.js
          bitvm3/utxo_referee/tradelayer_pnl_batch_state_store.test.js
          bitvm3/utxo_referee/utxoref_v2_pnl_batch_checkpoint.test.js
          bitvm3/utxo_referee/utxoref_v2_pnl_batch_execution.test.js
      - name: Pinned Bitcoin Core 31.1
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 120 https://bitcoincore.org/bin/bitcoin-core-31.1/bitcoin-31.1-x86_64-linux-gnu.tar.gz --output "$RUNNER_TEMP/bitcoin-31.1.tar.gz"
          printf '%s  %s\n' 'b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e' "$RUNNER_TEMP/bitcoin-31.1.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/bitcoin-31.1.tar.gz" -C "$RUNNER_TEMP"
      - name: Isolated funded batch with confirmation and reorg
        env:
          BITCOIN_BIN: ${{ runner.temp }}/bitcoin-31.1/bin
        run: node eval/pnl_batch_regtest.js --out "${{ runner.temp }}/pnl-batch-regtest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pnl-batch-regtest-evidence
          path: ${{ runner.temp }}/pnl-batch-regtest.json

  rust-signer-library:
    # The signing-target derivation is platform independent and is checked
    # against the same vectors as the JavaScript host. The Windows signer
    # process itself is type-checked for its target here; building and
    # attesting the binary remains a separate audited step.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/dlc-signer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-gnu
      - name: Signing-target library tests
        run: cargo test --lib --locked
      - name: Type-check the Windows signer
        run: cargo check --locked --target x86_64-pc-windows-gnu
