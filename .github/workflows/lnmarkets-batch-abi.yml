name: LN Markets batch ABI

on:
  push:
    paths:
      - "LNMarkets/**"
      - "bitvm3/utxo_referee/**"
      - ".github/workflows/lnmarkets-batch-abi.yml"
  pull_request:
    paths:
      - "LNMarkets/**"
      - "bitvm3/utxo_referee/**"
      - ".github/workflows/lnmarkets-batch-abi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lnmarkets-batch-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/zk-rusto-no-bitcoino
          ref: 992cdb1c51b5c7a630ea552b2648acbad4308a9b
          path: .companion
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the pinned companion relation
        run: cargo +stable build --locked --release --manifest-path .companion/LNMarkets/statement/Cargo.toml
      - name: Verify the two-trade ABI and both mutation cases
        run: |
          node LNMarkets/batch-demo.js \
            --out "$RUNNER_TEMP/lnmarkets-batch-abi" \
            --native .companion/LNMarkets/statement/target/release/lnm-native
      - name: Test Nova batch constraints
        run: |
          cargo +stable test --locked --release --manifest-path LNMarkets/nova/Cargo.toml -- --test-threads=1
          LNM_BATCH_FIXTURE="$RUNNER_TEMP/lnmarkets-batch-abi" \
            cargo +stable test --locked --release --manifest-path LNMarkets/nova/Cargo.toml \
            native_fixture_binds_every_row -- --ignored --test-threads=1
      - name: Verify the saved GPU proof set on CPU
        run: |
          cargo +stable build --locked --release --manifest-path LNMarkets/nova/Cargo.toml \
            --bin lnm-nova-verify
          LNM_NOVA_VERIFIER="$PWD/LNMarkets/nova/target/release/lnm-nova-verify" \
            LNM_NOVA_PROOFS="$PWD/LNMarkets/evidence/nova-two-trade-proofs" \
            node --test LNMarkets/test/nova-proof-set.test.js
