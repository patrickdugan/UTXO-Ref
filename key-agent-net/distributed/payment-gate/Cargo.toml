[package]
name = "kan-payment-gate"
version = "0.1.0"
edition = "2021"
publish = false
# m13-verify (the final-proof verifier this gate links) is GPL-3.0-only.
license = "GPL-3.0-only"
description = "KeyAgentNet Custodian A payment gate: release a signature only on a verified nova-bitvm3 M16 payment statement"

[features]
default = ["verify"]
# The final-proof check. Without it the crate builds only the statement parser and policy
# check, which need no SP1 dependencies.
verify = ["dep:m13-verify", "dep:bincode"]

[dependencies]
m13-verify = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "d4aefcdf714874d23b6a5bbfb64616cc27dcdb32", optional = true }
bincode = { version = "1.3", optional = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[[bin]]
name = "kan-payment-gate"
path = "src/main.rs"
required-features = ["verify"]

[profile.test]
opt-level = 3

[workspace]
